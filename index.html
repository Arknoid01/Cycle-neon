<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#00eeff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <title>Light Cycle Neon</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="game-hud">
    <div id="hud-bar" class="hud-bar">
      <div class="hud-panel hud-panel-left">
        <div id="arena-name" class="hud-arena"></div>
        <div id="rivals" class="hud-rivals"></div>
        <div id="challenge-hud" class="hud-challenge"></div>
      </div>
      <div id="score-wrap" class="hud-score-wrap">
        <div class="hud-score-label">SCORE</div>
        <div id="score">0</div>
        <div id="high-score" class="hud-best"></div>
      </div>
      <div class="hud-panel hud-panel-right">
        <div id="timer" class="hud-timer">00:00</div>
        <div id="combo-meter" class="combo-meter combo-idle" data-level="1">
          <div class="combo-label">COMBO</div>
          <div id="combo-value" class="combo-value" data-level="1">×1</div>
          <div class="combo-track"><div id="combo-fill" class="combo-fill" data-level="1"></div></div>
        </div>
        <div id="champ-hud" class="hud-champ hidden"></div>
      </div>
    </div>
    <div id="float-layer"></div>
    <div id="overlay" class="hidden">
      <div class="overlay-card">
        <div id="overlay-badge" class="overlay-badge hidden"></div>
        <div id="overlay-title"></div>
        <div id="overlay-score"></div>
        <div id="overlay-stats" class="overlay-stats"></div>
        <div id="overlay-best"></div>
        <div id="overlay-record" class="hidden">NOUVEAU RECORD !</div>
        <div id="overlay-trophies" class="overlay-trophies hidden">
          <div class="trophy-celebrate-head">
            <span class="trophy-burst">★</span>
            <span>TROPHÉES DÉBLOQUÉS</span>
            <span class="trophy-burst">★</span>
          </div>
          <div id="trophy-unlock-list" class="trophy-unlock-list"></div>
        </div>
        <div id="overlay-next"></div>
        <div id="overlay-actions" class="overlay-actions hidden">
          <button type="button" id="overlay-replay" class="overlay-btn overlay-btn-primary">Rejouer</button>
          <button type="button" id="overlay-menu" class="overlay-btn">Menu</button>
        </div>
        <div id="overlay-hint">Toucher pour continuer</div>
      </div>
    </div>

    <div id="arena-intro" class="hidden">
      <div id="arena-intro-label">ARÈNE</div>
      <div id="arena-intro-name"></div>
      <div id="arena-intro-desc"></div>
    </div>
    <div id="controls" class="hidden">
      <button type="button" id="btn-left" class="control-btn" aria-label="Gauche"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
      <button type="button" id="btn-right" class="control-btn" aria-label="Droite"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
    </div>
    </div>

    <div id="home-menu">
      <div id="home-screen" class="menu-screen">
        <header class="home-header">
          <div class="home-title">LIGHT CYCLE</div>
          <div class="home-sub">NEON GRID</div>
          <div id="home-best" class="home-best"></div>
          <div id="home-champ-best" class="home-champ-best"></div>
        </header>
        <div class="tile-grid">
          <button type="button" class="menu-tile tile-play" data-screen="play">
            <span class="tile-icon">▶</span>
            <span class="tile-label">Nouvelle partie</span>
            <span class="tile-desc">Choisir un scénario</span>
          </button>
          <button type="button" class="menu-tile tile-custom" data-screen="custom">
            <span class="tile-icon">◈</span>
            <span class="tile-label">Personnalisation</span>
            <span class="tile-desc">Couleur du cycle</span>
          </button>
          <button type="button" class="menu-tile tile-trophies" data-screen="trophies">
            <span class="tile-icon">★</span>
            <span class="tile-label">Trophées</span>
            <span class="tile-desc" id="trophy-summary">Défis et records</span>
          </button>
          <button type="button" class="menu-tile tile-options" data-screen="options">
            <span class="tile-icon">⚙</span>
            <span class="tile-label">Options</span>
            <span class="tile-desc">Son et confort</span>
          </button>
        </div>
        <footer id="home-progress" class="home-progress">
          <div class="home-progress-head">
            <span id="home-rank-title" class="home-rank-title">Recrue</span>
            <span id="home-total-points" class="home-total-points">0 pts</span>
          </div>
          <div class="home-progress-track">
            <div id="home-progress-fill" class="home-progress-fill"></div>
            <div id="home-progress-bubble" class="home-progress-bubble">
              <span id="home-progress-reward" class="home-progress-reward">Novice · Grid Rider</span>
              <span id="home-progress-pts" class="home-progress-pts">0 / 20 000</span>
            </div>
          </div>
        </footer>
      </div>

      <div id="play-screen" class="menu-screen hidden">
        <button type="button" class="menu-back" data-back>← Accueil</button>
        <h2 class="screen-title">Nouvelle partie</h2>
        <button type="button" id="start-championship" class="arena-btn arena-championship">
          <div class="arena-btn-name">🏆 Championnat</div>
          <div class="arena-btn-desc">5 manches · 6 concurrents · points cumulés</div>
        </button>
        <p class="screen-sub section-label">Arène rapide</p>
        <div id="arena-list"></div>
        <button type="button" id="arena-random" class="arena-btn arena-random">
          <div class="arena-btn-name">Aléatoire</div>
          <div class="arena-btn-desc">Une arène surprise à chaque partie</div>
        </button>
      </div>

      <div id="custom-screen" class="menu-screen hidden">
        <button type="button" class="menu-back" data-back>← Accueil</button>
        <h2 class="screen-title">Personnalisation</h2>
        <p class="screen-sub">Couleur + skin de ton light cycle</p>
        <div class="bike-preview-wrap">
          <canvas id="bike-preview-canvas" class="bike-preview-canvas"></canvas>
        </div>
        <p class="picker-label">Couleur</p>
        <div id="cosmetic-picker"></div>
        <p class="picker-label">Skin</p>
        <div id="skin-picker" class="skin-picker"></div>
        <p class="skin-picker-hint" id="skin-picker-hint"></p>
      </div>

      <div id="trophies-screen" class="menu-screen hidden">
        <button type="button" class="menu-back" data-back>← Accueil</button>
        <h2 class="screen-title">Trophées</h2>
        <p class="screen-sub" id="trophies-progress"></p>
        <div id="stats-panel" class="stats-panel"></div>
        <button type="button" id="launch-challenge" class="launch-challenge-btn hidden">▶ Lancer ce défi</button>
        <div id="challenges-list"></div>
      </div>

      <div id="options-screen" class="menu-screen hidden">
        <button type="button" class="menu-back" data-back>← Accueil</button>
        <h2 class="screen-title">Options</h2>
        <div class="options-list">
          <label class="option-row">
            <span class="option-label">Volume</span>
            <input type="range" id="opt-volume" min="0" max="100" value="100">
          </label>
          <label class="option-row option-toggle">
            <span class="option-label">Vibrations</span>
            <input type="checkbox" id="opt-haptic" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
          <label class="option-row option-toggle">
            <span class="option-label">Bloom néon</span>
            <input type="checkbox" id="opt-bloom" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </div>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/menu-shell.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
