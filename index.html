<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Light Cycle Neon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #hud-top {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-top: 8px;
      gap: 8px;
    }

    #arena-name {
      font-size: 11px;
      color: rgba(255, 136, 0, 0.85);
      text-shadow: 0 0 8px rgba(255, 100, 0, 0.6);
      letter-spacing: 1px;
      max-width: 42%;
      line-height: 1.3;
    }

    #high-score {
      font-size: 11px;
      color: rgba(255, 255, 0, 0.6);
      text-shadow: 0 0 6px rgba(255, 255, 0, 0.4);
      letter-spacing: 1px;
      text-align: right;
    }

    #score {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 0;
      right: 0;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #08f;
      padding-top: 28px;
      letter-spacing: 2px;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: auto;
    }

    #overlay.hidden {
      display: none;
    }

    #overlay-title {
      font-size: 14px;
      color: rgba(255, 136, 0, 0.8);
      text-shadow: 0 0 10px rgba(255, 100, 0, 0.5);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    #overlay-score {
      font-size: 48px;
      font-weight: bold;
      color: #f0f;
      text-shadow: 0 0 15px #f0f, 0 0 30px #f0f, 0 0 60px #80f;
      letter-spacing: 3px;
    }

    #overlay-best {
      font-size: 13px;
      color: rgba(255, 255, 0, 0.55);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    #overlay-record {
      font-size: 18px;
      color: #ff0;
      text-shadow: 0 0 10px #ff0, 0 0 20px #ff0;
      margin-top: 12px;
      letter-spacing: 2px;
    }

    #overlay-next {
      font-size: 12px;
      color: rgba(0, 255, 255, 0.45);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    #overlay-hint {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 24px;
      letter-spacing: 1px;
    }

    #controls {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 20px);
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: auto;
    }

    #controls.hidden {
      display: none;
    }

    .control-btn {
      width: 88px;
      height: 88px;
      border: 2px solid rgba(0, 255, 255, 0.22);
      border-radius: 18px;
      background: rgba(0, 255, 255, 0.06);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      color: rgba(0, 255, 255, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.08s, border-color 0.08s, color 0.08s, transform 0.08s;
      touch-action: manipulation;
    }

    .control-btn svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
      filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.5));
    }

    .control-btn:active,
    .control-btn.pressed {
      background: rgba(0, 255, 255, 0.18);
      border-color: rgba(0, 255, 255, 0.55);
      color: rgba(0, 255, 255, 0.95);
      transform: scale(0.94);
    }

    @media (min-height: 700px) {
      .control-btn {
        width: 100px;
        height: 100px;
      }

      .control-btn svg {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="hud-top">
      <div id="arena-name"></div>
      <div id="high-score"></div>
    </div>
    <div id="score">0</div>
    <div id="overlay" class="hidden">
      <div id="overlay-title"></div>
      <div id="overlay-score"></div>
      <div id="overlay-best"></div>
      <div id="overlay-record" class="hidden">NOUVEAU RECORD !</div>
      <div id="overlay-next"></div>
      <div id="overlay-hint">Toucher pour rejouer</div>
    </div>
    <div id="controls" class="hidden">
      <button type="button" id="btn-left" class="control-btn" aria-label="Tourner à gauche">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <button type="button" id="btn-right" class="control-btn" aria-label="Tourner à droite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    const CELL_EMPTY = 0;
    const CELL_TRAIL = 1;
    const CELL_WALL = 2;

    const DIR_UP = 0;
    const DIR_RIGHT = 1;
    const DIR_DOWN = 2;
    const DIR_LEFT = 3;

    const DX = [0, 1, 0, -1];
    const DY = [-1, 0, 1, 0];

    const COLORS = {
      trail: '#0ff',
      trailGlow: '#08f',
      player: '#f0f',
      playerGlow: '#80f',
      wall: '#f44',
      wallGlow: '#f00',
      mobileWall: '#ff8800',
      mobileWallGlow: '#ff4400',
      grid: 'rgba(0, 40, 60, 0.35)',
    };

    const BASE_TICK = 130;
    const MIN_TICK = 62;

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const arenaNameEl = document.getElementById('arena-name');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayScore = document.getElementById('overlay-score');
    const overlayBest = document.getElementById('overlay-best');
    const overlayRecord = document.getElementById('overlay-record');
    const overlayNext = document.getElementById('overlay-next');
    const overlayHint = document.getElementById('overlay-hint');
    const controls = document.getElementById('controls');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    let gridW, gridH, baseCellSize;
    let groundY, horizonY, focalLength;
    let camAngle, displayX, displayY;
    let score;
    let highScore;
    let tickMs;
    let lastTick;
    let playing;
    let turnQueue;
    let particles;
    let shakeTimer;
    let audioCtx;
    let engineOsc;
    let engineGain;
    let audioReady;

    const VIEW_FORWARD = 22;
    const VIEW_BACK = 1;
    const VIEW_SIDE = 12;
    const CAM_ANGLES = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];

    let grid;
    let player;
    let mobileWalls;
    let arenaState;
    let currentArena;
    let nextArenaPreview;

    const ARENAS = [
      {
        id: 'battement',
        name: 'Le Battement',
        next: 'Le Compresseur',
        init() {
          mobileWalls = [
            {
              x: Math.floor(gridW / 2),
              y: Math.floor(gridH / 2),
              dir: DIR_RIGHT,
              min: 3,
              max: gridW - 4,
              interval: 4000,
              lastMove: performance.now(),
              warning: false,
            },
            {
              x: Math.floor(gridW / 2),
              y: Math.floor(gridH / 3),
              dir: DIR_LEFT,
              min: 3,
              max: gridW - 4,
              interval: 3000,
              lastMove: performance.now(),
              warning: false,
            },
          ];
          arenaState = {};
        },
        update(now) {
          for (const w of mobileWalls) {
            const elapsed = now - w.lastMove;
            w.warning = elapsed > w.interval - 800;
            if (elapsed >= w.interval) {
              w.lastMove = now;
              const step = w.dir === DIR_RIGHT ? 1 : -1;
              let next = w.x + step;
              if (next > w.max || next < w.min) {
                w.dir = w.dir === DIR_RIGHT ? DIR_LEFT : DIR_RIGHT;
                next = w.x + (w.dir === DIR_RIGHT ? 1 : -1);
              }
              w.x = next;
              playWallShift();
            }
          }
        },
      },
      {
        id: 'compresseur',
        name: 'Le Compresseur',
        next: 'Le Piège',
        init() {
          mobileWalls = [];
          arenaState = {
            margin: 0,
            lastShrink: performance.now(),
            interval: 5000,
            warning: false,
          };
        },
        update(now) {
          const s = arenaState;
          const elapsed = now - s.lastShrink;
          s.warning = elapsed > s.interval - 1000;
          if (elapsed >= s.interval) {
            s.lastShrink = now;
            s.margin++;
            const m = s.margin;
            const limit = Math.floor(Math.min(gridW, gridH) / 2) - 3;
            if (m > limit) return;

            for (let x = m; x < gridW - m; x++) {
              setCell(x, m, CELL_WALL);
              setCell(x, gridH - 1 - m, CELL_WALL);
            }
            for (let y = m; y < gridH - m; y++) {
              setCell(m, y, CELL_WALL);
              setCell(gridW - 1 - m, y, CELL_WALL);
            }
            playWallShift();
          }
        },
      },
      {
        id: 'piege',
        name: 'Le Piège',
        next: 'Le Classique',
        init() {
          mobileWalls = [];
          const cx = Math.floor(gridW / 2);
          arenaState = {
            gates: [
              { x: cx - 2, yMin: 2, yMax: gridH - 3, open: true, interval: 4500, lastToggle: performance.now(), warning: false },
              { x: cx + 2, yMin: 2, yMax: gridH - 3, open: true, interval: 3500, lastToggle: performance.now(), warning: false },
            ],
          };
          syncGates();
        },
        update(now) {
          for (const g of arenaState.gates) {
            const elapsed = now - g.lastToggle;
            g.warning = elapsed > g.interval - 900;
            if (elapsed >= g.interval) {
              g.lastToggle = now;
              g.open = !g.open;
              syncGate(g);
              playWallShift();
            }
          }
        },
      },
      {
        id: 'classique',
        name: 'Le Classique',
        next: 'Le Battement',
        init() {
          mobileWalls = [];
          arenaState = {};
        },
        update() {},
      },
    ];

    function syncGate(g) {
      for (let y = g.yMin; y <= g.yMax; y++) {
        if (g.open) {
          if (getCell(g.x, y) === CELL_WALL) setCell(g.x, y, CELL_EMPTY);
        } else {
          setCell(g.x, y, CELL_WALL);
        }
      }
    }

    function syncGates() {
      for (const g of arenaState.gates) syncGate(g);
    }

    function selectArena() {
      return ARENAS[Math.floor(Math.random() * ARENAS.length)];
    }

    function pickArenas(rotate) {
      if (rotate) {
        currentArena = nextArenaPreview;
      }
      nextArenaPreview = selectArena();
    }

    function loadHighScore() {
      try {
        return parseInt(localStorage.getItem('lc_highscore') || '0', 10);
      } catch {
        return 0;
      }
    }

    function saveHighScore(val) {
      try {
        localStorage.setItem('lc_highscore', String(val));
      } catch { /* file:// ou mode privé */ }
    }

    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        engineOsc = audioCtx.createOscillator();
        engineGain = audioCtx.createGain();
        engineOsc.type = 'sawtooth';
        engineOsc.frequency.value = 90;
        engineGain.gain.value = 0;
        engineOsc.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineOsc.start();
        audioReady = true;
      } catch { /* audio unavailable */ }
    }

    function unlockAudio() {
      if (!audioCtx) initAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (engineGain && playing) engineGain.gain.value = 0.028;
    }

    function updateEngineSound() {
      if (!engineOsc || !engineGain || !playing) return;
      const speed = (BASE_TICK - tickMs) / (BASE_TICK - MIN_TICK);
      engineOsc.frequency.setTargetAtTime(70 + speed * 140, audioCtx.currentTime, 0.05);
      engineGain.gain.setTargetAtTime(0.02 + speed * 0.03, audioCtx.currentTime, 0.05);
    }

    function stopEngine() {
      if (engineGain) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    }

    function playTone(freq, dur, type, vol) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.value = vol || 0.08;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    function playTurn() {
      playTone(320, 0.06, 'square', 0.05);
    }

    function playWallShift() {
      playTone(180, 0.12, 'sawtooth', 0.06);
    }

    function playNearMiss() {
      playTone(520, 0.08, 'sine', 0.07);
    }

    function playCrash() {
      if (!audioCtx) return;
      for (let i = 0; i < 5; i++) {
        setTimeout(() => playTone(80 + Math.random() * 200, 0.15, 'sawtooth', 0.12), i * 40);
      }
    }

    function initGridDimensions() {
      const margin = 16;
      const availW = canvas.width - margin * 2;
      const availH = canvas.height - margin * 2 - 80;

      const targetCols = 18;
      const targetRows = 28;

      baseCellSize = Math.floor(Math.min(availW / targetCols, availH / targetRows));
      baseCellSize = Math.max(baseCellSize, 12);

      gridW = Math.floor(availW / baseCellSize);
      gridH = Math.floor(availH / baseCellSize);

      groundY = canvas.height * 0.76;
      horizonY = canvas.height * 0.24;
      focalLength = 5.8;
    }

    function lerpAngle(current, target, t) {
      let diff = target - current;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      return current + diff * t;
    }

    function updateCamera() {
      if (!player) return;
      displayX += (player.x - displayX) * 0.3;
      displayY += (player.y - displayY) * 0.3;
      camAngle = lerpAngle(camAngle, CAM_ANGLES[player.dir], 0.16);
      const speed = (BASE_TICK - tickMs) / (BASE_TICK - MIN_TICK);
      focalLength = 5.6 + speed * 1.1;
    }

    function worldToCamera(gx, gy) {
      const relX = gx - displayX;
      const relY = gy - displayY;
      const fwdX = Math.cos(camAngle);
      const fwdY = Math.sin(camAngle);
      const rightX = Math.sin(camAngle);
      const rightY = -Math.cos(camAngle);
      return {
        forward: relX * fwdX + relY * fwdY,
        side: relX * rightX + relY * rightY,
      };
    }

    function project(gx, gy) {
      const { forward, side } = worldToCamera(gx, gy);
      if (forward < -VIEW_BACK || forward > VIEW_FORWARD) return null;
      if (Math.abs(side) > VIEW_SIDE + 1) return null;

      const depth = forward + 4;
      const persp = focalLength / depth;
      const size = baseCellSize * persp * 1.05;
      const screenX = canvas.width / 2 + side * baseCellSize * persp;
      const screenY = groundY - forward * baseCellSize * persp * 0.94;

      if (screenY < horizonY - 30 || screenY > canvas.height + size) return null;

      return { screenX, screenY, size, forward, persp };
    }

    function createGrid() {
      grid = new Uint8Array(gridW * gridH);

      for (let x = 0; x < gridW; x++) {
        setCell(x, 0, CELL_WALL);
        setCell(x, gridH - 1, CELL_WALL);
      }
      for (let y = 0; y < gridH; y++) {
        setCell(0, y, CELL_WALL);
        setCell(gridW - 1, y, CELL_WALL);
      }
    }

    function getCell(x, y) {
      if (x < 0 || x >= gridW || y < 0 || y >= gridH) return CELL_WALL;
      return grid[y * gridW + x];
    }

    function setCell(x, y, val) {
      if (x < 0 || x >= gridW || y < 0 || y >= gridH) return;
      grid[y * gridW + x] = val;
    }

    function createPlayer() {
      const startX = Math.floor(gridW / 2);
      const startY = gridH - 4;
      player = {
        x: startX,
        y: startY,
        dir: DIR_UP,
        prevX: startX,
        prevY: startY,
      };
    }

    function updateHud() {
      arenaNameEl.textContent = currentArena.name;
      highScoreEl.textContent = 'BEST ' + highScore.toLocaleString('fr-FR');
      scoreEl.textContent = score.toLocaleString('fr-FR');
    }

    function resetGame(rotateArena) {
      initGridDimensions();
      createGrid();
      if (rotateArena) pickArenas(true);
      currentArena.init();
      createPlayer();
      score = 0;
      tickMs = BASE_TICK;
      lastTick = 0;
      turnQueue = null;
      particles = [];
      shakeTimer = 0;
      playing = true;
      camAngle = CAM_ANGLES[player.dir];
      displayX = player.x;
      displayY = player.y;
      overlay.classList.add('hidden');
      controls.classList.remove('hidden');
      updateHud();
      unlockAudio();
      updateEngineSound();
    }

    function turnLeft() {
      if (!playing) return;
      unlockAudio();
      const newDir = (player.dir + 3) % 4;
      if (newDir !== (player.dir + 2) % 4) {
        turnQueue = newDir;
        playTurn();
      }
    }

    function turnRight() {
      if (!playing) return;
      unlockAudio();
      const newDir = (player.dir + 1) % 4;
      if (newDir !== (player.dir + 2) % 4) {
        turnQueue = newDir;
        playTurn();
      }
    }

    function isMobileWallAt(x, y) {
      for (const w of mobileWalls) {
        if (w.x === x && w.y === y) return true;
      }
      return false;
    }

    function checkNearMiss() {
      for (let d = 0; d < 4; d++) {
        const nx = player.x + DX[d];
        const ny = player.y + DY[d];
        const cell = getCell(nx, ny);
        if (cell === CELL_WALL || cell === CELL_TRAIL || isMobileWallAt(nx, ny)) {
          playNearMiss();
          return;
        }
      }
    }

    function spawnParticles(gx, gy, color, count) {
      const proj = project(gx, gy);
      const cx = proj ? proj.screenX : canvas.width / 2;
      const cy = proj ? proj.screenY : groundY - baseCellSize * 0.2;
      const n = count || 24;
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 * i) / n + Math.random() * 0.3;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color,
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function gameTick(now) {
      if (!playing) return;

      if (turnQueue !== null) {
        player.dir = turnQueue;
        turnQueue = null;
      }

      player.prevX = player.x;
      player.prevY = player.y;

      const nx = player.x + DX[player.dir];
      const ny = player.y + DY[player.dir];

      const cell = getCell(nx, ny);
      const hitMobile = isMobileWallAt(nx, ny);

      if (cell === CELL_WALL || cell === CELL_TRAIL || hitMobile) {
        die();
        return;
      }

      setCell(player.x, player.y, CELL_TRAIL);
      player.x = nx;
      player.y = ny;
      score++;

      if (score % 12 === 0 && tickMs > MIN_TICK) {
        tickMs -= 2;
        updateEngineSound();
      }

      checkNearMiss();
      updateHud();
    }

    function die() {
      playing = false;
      shakeTimer = 400;
      stopEngine();
      playCrash();
      spawnParticles(player.x, player.y, COLORS.player, 32);
      spawnParticles(player.x, player.y, COLORS.trail, 24);

      const isRecord = score > highScore;
      if (isRecord) {
        highScore = score;
        saveHighScore(highScore);
      }

      overlayTitle.textContent = currentArena.name;
      overlayScore.textContent = score.toLocaleString('fr-FR');
      overlayBest.textContent = 'Record : ' + highScore.toLocaleString('fr-FR');
      overlayRecord.classList.toggle('hidden', !isRecord);
      overlayNext.textContent = 'Prochaine arène : ' + nextArenaPreview.name;
      overlayHint.textContent = 'Toucher pour rejouer';
      overlay.classList.remove('hidden');
      controls.classList.add('hidden');
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (grid) {
        if (playing) resetGame(false);
        else initGridDimensions();
      }
    }

    function drawTile(proj, color, glowColor, alpha) {
      const pad = 0.08;
      const s = proj.size;
      ctx.globalAlpha = alpha ?? 1;
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = s * 0.7;
      ctx.fillStyle = color;
      ctx.fillRect(proj.screenX - s / 2 + s * pad, proj.screenY - s / 2 + s * pad, s * (1 - pad * 2), s * (1 - pad * 2));
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    function collectTiles() {
      const tiles = [];

      for (let y = 0; y < gridH; y++) {
        for (let x = 0; x < gridW; x++) {
          const cell = grid[y * gridW + x];
          if (cell === CELL_EMPTY) continue;
          const proj = project(x, y);
          if (!proj) continue;

          if (cell === CELL_TRAIL) {
            tiles.push({ proj, color: COLORS.trail, glow: COLORS.trailGlow, alpha: 0.82 });
          } else if (cell === CELL_WALL) {
            tiles.push({ proj, color: COLORS.wall, glow: COLORS.wallGlow, alpha: 0.72 });
          }
        }
      }

      for (const w of mobileWalls) {
        const proj = project(w.x, w.y);
        if (!proj) continue;
        const alpha = w.warning ? 0.5 + Math.sin(Date.now() / 100) * 0.3 : 0.9;
        tiles.push({ proj, color: COLORS.mobileWall, glow: COLORS.mobileWallGlow, alpha });
      }

      if (currentArena.id === 'piege' && arenaState.gates) {
        for (const g of arenaState.gates) {
          if (g.open) continue;
          const alpha = g.warning ? 0.5 + Math.sin(Date.now() / 100) * 0.3 : 0.85;
          for (let y = g.yMin; y <= g.yMax; y++) {
            const proj = project(g.x, y);
            if (!proj) continue;
            tiles.push({ proj, color: COLORS.mobileWall, glow: COLORS.mobileWallGlow, alpha });
          }
        }
      }

      tiles.sort((a, b) => b.proj.forward - a.proj.forward);
      return tiles;
    }

    function drawSky() {
      const grad = ctx.createLinearGradient(0, 0, 0, groundY);
      grad.addColorStop(0, '#080018');
      grad.addColorStop(0.45, '#0a1428');
      grad.addColorStop(1, '#000000');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, groundY + 4);

      ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, horizonY);
      ctx.lineTo(canvas.width, horizonY);
      ctx.stroke();
    }

    function drawFloorGrid() {
      const speed = (BASE_TICK - tickMs) / (BASE_TICK - MIN_TICK);
      ctx.lineWidth = 1;

      for (let f = -VIEW_BACK; f <= VIEW_FORWARD; f += 1) {
        const persp = focalLength / (f + 4);
        const alpha = Math.max(0.04, (0.22 - f * 0.008) * persp * 0.35);
        ctx.strokeStyle = `rgba(0, 180, 220, ${alpha})`;
        ctx.beginPath();
        let started = false;

        for (let s = -VIEW_SIDE; s <= VIEW_SIDE; s += 0.5) {
          const gx = displayX + Math.cos(camAngle) * f + Math.sin(camAngle) * s;
          const gy = displayY + Math.sin(camAngle) * f - Math.cos(camAngle) * s;
          const proj = project(gx, gy);
          if (!proj) continue;
          if (!started) {
            ctx.moveTo(proj.screenX, proj.screenY);
            started = true;
          } else {
            ctx.lineTo(proj.screenX, proj.screenY);
          }
        }
        if (started) ctx.stroke();
      }

      for (let s = -VIEW_SIDE; s <= VIEW_SIDE; s += 1) {
        ctx.beginPath();
        let started = false;
        for (let f = -VIEW_BACK; f <= VIEW_FORWARD; f += 0.5) {
          const gx = displayX + Math.cos(camAngle) * f + Math.sin(camAngle) * s;
          const gy = displayY + Math.sin(camAngle) * f - Math.cos(camAngle) * s;
          const proj = project(gx, gy);
          if (!proj) continue;
          if (!started) {
            ctx.moveTo(proj.screenX, proj.screenY);
            started = true;
          } else {
            ctx.lineTo(proj.screenX, proj.screenY);
          }
        }
        if (started) {
          const persp = focalLength / (VIEW_FORWARD / 2 + 4);
          ctx.strokeStyle = `rgba(0, 140, 200, ${0.06 + speed * 0.04})`;
          ctx.stroke();
        }
      }
    }

    function drawCompressWarning() {
      if (currentArena.id !== 'compresseur' || !arenaState.warning) return;
      const m = arenaState.margin + 1;
      const alpha = 0.12 + Math.sin(Date.now() / 120) * 0.08;
      ctx.strokeStyle = `rgba(255, 80, 0, ${alpha})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      let started = false;

      for (let i = 0; i <= 4; i++) {
        const t = i / 4;
        const gx = m + t * (gridW - 1 - 2 * m);
        const proj = project(gx, m);
        if (!proj) continue;
        if (!started) { ctx.moveTo(proj.screenX, proj.screenY); started = true; }
        else ctx.lineTo(proj.screenX, proj.screenY);
      }
      for (let i = 0; i <= 4; i++) {
        const t = i / 4;
        const gx = m + t * (gridW - 1 - 2 * m);
        const proj = project(gx, gridH - 1 - m);
        if (proj) ctx.lineTo(proj.screenX, proj.screenY);
      }
      if (started) ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawSpeedLines() {
      const speed = (BASE_TICK - tickMs) / (BASE_TICK - MIN_TICK);
      if (speed < 0.25) return;
      const count = Math.floor(speed * 10);
      ctx.strokeStyle = `rgba(0, 255, 255, ${0.04 + speed * 0.08})`;
      ctx.lineWidth = 1;
      for (let i = 0; i < count; i++) {
        const side = (Math.random() - 0.5) * VIEW_SIDE * 1.6;
        const forward = Math.random() * VIEW_FORWARD * 0.7;
        const gx = displayX + Math.cos(camAngle) * forward + Math.sin(camAngle) * side;
        const gy = displayY + Math.sin(camAngle) * forward - Math.cos(camAngle) * side;
        const proj = project(gx, gy);
        if (!proj) continue;
        const len = baseCellSize * proj.persp * (0.4 + speed);
        ctx.beginPath();
        ctx.moveTo(proj.screenX, proj.screenY);
        ctx.lineTo(proj.screenX, proj.screenY + len);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      const speed = (BASE_TICK - tickMs) / (BASE_TICK - MIN_TICK);
      const bob = Math.sin(Date.now() / (90 - speed * 25)) * speed * 2.5;
      const px = canvas.width / 2;
      const py = groundY - baseCellSize * 0.22 + bob;
      const size = baseCellSize * (0.42 + speed * 0.14);
      const glow = baseCellSize * (1.2 + speed * 0.8);

      ctx.save();
      ctx.translate(px, py);

      ctx.shadowColor = COLORS.playerGlow;
      ctx.shadowBlur = glow;
      ctx.fillStyle = COLORS.player;
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size * 0.7, size * 0.6);
      ctx.lineTo(0, size * 0.3);
      ctx.lineTo(-size * 0.7, size * 0.6);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = glow * 0.45;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.5);
      ctx.lineTo(size * 0.25, size * 0.2);
      ctx.lineTo(-size * 0.25, size * 0.2);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    function render() {
      let shakeX = 0;
      let shakeY = 0;
      if (shakeTimer > 0) {
        shakeTimer -= 16;
        shakeX = (Math.random() - 0.5) * 8;
        shakeY = (Math.random() - 0.5) * 8;
      }

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(shakeX, shakeY);

      drawSky();
      drawFloorGrid();
      drawSpeedLines();

      const tiles = collectTiles();
      for (const t of tiles) {
        drawTile(t.proj, t.color, t.glow, t.alpha);
      }

      drawCompressWarning();
      if (playing) drawPlayer();
      drawParticles();

      ctx.restore();
    }

    function gameLoop(timestamp) {
      updateCamera();

      if (playing && timestamp - lastTick >= tickMs) {
        currentArena.update(timestamp);
        gameTick(timestamp);
        lastTick = timestamp;
      }

      if (!playing) updateParticles();
      render();
      requestAnimationFrame(gameLoop);
    }

    function bindControlButton(btn, action) {
      const press = (e) => {
        e.preventDefault();
        if (!playing) return;
        btn.classList.add('pressed');
        action();
      };
      const release = () => btn.classList.remove('pressed');

      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointerleave', release);
      btn.addEventListener('pointercancel', release);
    }

    bindControlButton(btnLeft, turnLeft);
    bindControlButton(btnRight, turnRight);

    overlay.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      unlockAudio();
      resetGame(true);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (!playing) {
          unlockAudio();
          resetGame(true);
        } else turnLeft();
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (!playing) {
          unlockAudio();
          resetGame(true);
        } else turnRight();
      } else if (e.key === ' ' || e.key === 'Enter') {
        if (!playing) {
          unlockAudio();
          resetGame(true);
        }
      }
    });

    window.addEventListener('resize', resize);

    highScore = loadHighScore();
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    nextArenaPreview = selectArena();
    currentArena = selectArena();
    resetGame(false);
    requestAnimationFrame(gameLoop);
  })();
  </script>
</body>
</html>
