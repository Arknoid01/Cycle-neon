<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#00eeff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Light Cycle Neon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; user-select: none; }
    #game { display: block; width: 100%; height: 100%; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #hud-top { position: absolute; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px; display: flex; justify-content: space-between; padding-top: 8px; }
    #arena-name { font-size: 11px; color: rgba(255,136,0,.85); text-shadow: 0 0 8px rgba(255,100,0,.6); max-width: 42%; }
    #timer { font-size: 13px; color: rgba(255,255,255,.92); text-align: right; }
    #score { position: absolute; top: env(safe-area-inset-top, 16px); left: 0; right: 0; text-align: center; font-size: 28px; font-weight: bold; color: #7df9ff; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; padding-top: 28px; }
    #high-score { position: absolute; top: env(safe-area-inset-top, 52px); left: 12px; font-size: 10px; color: rgba(0,255,120,.55); }
    #rivals { position: absolute; top: env(safe-area-inset-top, 52px); right: 12px; font-size: 10px; color: rgba(255,100,180,.7); text-align: right; }
    #challenge-hud { position: absolute; top: env(safe-area-inset-top, 68px); left: 0; right: 0; text-align: center; font-size: 10px; color: rgba(255,220,80,.65); pointer-events: none; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.55); pointer-events: auto; }
    #overlay.hidden { display: none; }
    #overlay-title { font-size: 14px; color: rgba(255,136,0,.8); margin-bottom: 8px; }
    #overlay-score { font-size: 48px; font-weight: bold; color: #f0f; text-shadow: 0 0 15px #f0f, 0 0 30px #f0f; }
    #overlay-best { font-size: 13px; color: rgba(255,255,0,.55); margin-top: 8px; }
    #overlay-record { font-size: 18px; color: #ff0; text-shadow: 0 0 10px #ff0; margin-top: 12px; }
    #overlay-challenge { font-size: 14px; color: #0f8; text-shadow: 0 0 8px #0f8; margin-top: 10px; }
    #overlay-challenge.hidden { display: none; }
    #overlay-next { font-size: 12px; color: rgba(0,255,255,.45); margin-top: 8px; }
    #overlay-hint { font-size: 14px; color: rgba(255,255,255,.5); margin-top: 24px; }
    #arena-intro {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.7); pointer-events: none;
      transition: opacity 0.4s;
    }
    #arena-intro.hidden { opacity: 0; pointer-events: none; }
    #arena-intro-label { font-size: 12px; color: rgba(255,136,0,.7); letter-spacing: 3px; margin-bottom: 12px; }
    #arena-intro-name { font-size: 32px; font-weight: bold; color: #7df9ff; text-shadow: 0 0 20px #0ff, 0 0 40px #08f; letter-spacing: 2px; }
    #arena-intro-desc { font-size: 13px; color: rgba(255,255,255,.45); margin-top: 16px; max-width: 80%; text-align: center; line-height: 1.4; }
    #controls { position: absolute; bottom: env(safe-area-inset-bottom, 20px); left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: auto; }
    #controls.hidden { display: none; }
    .control-btn { width: 88px; height: 88px; border: 2px solid rgba(0,255,255,.22); border-radius: 18px; background: rgba(0,255,255,.06); color: rgba(0,255,255,.45); cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
    .control-btn svg { width: 36px; height: 36px; fill: currentColor; filter: drop-shadow(0 0 6px rgba(0,255,255,.5)); }
    .control-btn:active, .control-btn.pressed { background: rgba(0,255,255,.18); border-color: rgba(0,255,255,.55); color: rgba(0,255,255,.95); transform: scale(.94); }
    #arena-menu {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.82); pointer-events: auto;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
      overflow-y: auto;
    }
    #arena-menu.hidden { display: none; }
    #arena-menu-title { font-size: 22px; font-weight: bold; color: #7df9ff; text-shadow: 0 0 20px #0ff; letter-spacing: 3px; margin-bottom: 4px; }
    #arena-menu-sub { font-size: 12px; color: rgba(255,136,0,.75); letter-spacing: 2px; margin-bottom: 20px; }
    #arena-list { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
    .arena-btn {
      width: 100%; padding: 14px 16px; border: 1px solid rgba(0,255,255,.25);
      border-radius: 12px; background: rgba(0,255,255,.05); color: #fff;
      text-align: left; cursor: pointer; touch-action: manipulation;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .arena-btn:active { background: rgba(0,255,255,.14); border-color: rgba(0,255,255,.55); transform: scale(.98); }
    .arena-btn-name { font-size: 15px; font-weight: bold; color: #7df9ff; margin-bottom: 4px; }
    .arena-btn-desc { font-size: 11px; color: rgba(255,255,255,.45); line-height: 1.35; }
    .arena-btn-best { font-size: 10px; color: rgba(0,255,120,.55); margin-top: 6px; }
    .arena-random { margin-top: 14px; text-align: center; border-color: rgba(255,136,0,.35); background: rgba(255,136,0,.06); }
    .arena-random .arena-btn-name { color: rgba(255,180,80,.95); }
    #cosmetic-section { width: 100%; max-width: 360px; margin-bottom: 18px; }
    #challenges-section { width: 100%; max-width: 360px; margin-bottom: 16px; }
    #challenges-label { font-size: 10px; color: rgba(255,255,255,.4); letter-spacing: 2px; margin-bottom: 8px; text-align: center; }
    #challenges-list { display: flex; flex-direction: column; gap: 6px; }
    .challenge-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03); font-size: 10px; color: rgba(255,255,255,.5);
    }
    .challenge-item.done { border-color: rgba(0,255,120,.25); color: rgba(0,255,120,.75); }
    .challenge-item.active { border-color: rgba(255,220,80,.45); background: rgba(255,220,80,.06); cursor: pointer; }
    .challenge-item:not(.done) { cursor: pointer; }
    .challenge-check { width: 14px; flex-shrink: 0; text-align: center; opacity: .35; }
    .challenge-item.done .challenge-check { opacity: 1; color: #0f8; }
    .challenge-name { font-weight: bold; color: rgba(255,220,80,.85); margin-bottom: 1px; }
    .challenge-item.done .challenge-name { color: rgba(0,255,120,.85); }
    #cosmetic-label { font-size: 10px; color: rgba(255,255,255,.4); letter-spacing: 2px; margin-bottom: 10px; text-align: center; }
    #cosmetic-picker { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .color-swatch {
      width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15);
      cursor: pointer; touch-action: manipulation; position: relative;
      box-shadow: 0 0 10px var(--swatch-glow, #0ff);
    }
    .color-swatch.selected { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 16px var(--swatch-glow, #0ff); }
    .color-swatch:active { transform: scale(.95); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud-top"><div id="arena-name"></div><div id="timer">T : 0.00</div></div>
    <div id="score">0</div>
    <div id="high-score"></div>
    <div id="rivals"></div>
    <div id="challenge-hud"></div>
    <div id="overlay" class="hidden">
      <div id="overlay-title"></div>
      <div id="overlay-score"></div>
      <div id="overlay-best"></div>
      <div id="overlay-record" class="hidden">NOUVEAU RECORD !</div>
      <div id="overlay-challenge" class="hidden"></div>
      <div id="overlay-next"></div>
      <div id="overlay-hint">Toucher pour choisir une arène</div>
    </div>
    <div id="arena-menu">
      <div id="arena-menu-title">LIGHT CYCLE</div>
      <div id="arena-menu-sub">CHOISIR UNE ARÈNE</div>
      <div id="cosmetic-section">
        <div id="cosmetic-label">TON CYCLE</div>
        <div id="cosmetic-picker"></div>
      </div>
      <div id="challenges-section">
        <div id="challenges-label">DÉFIS</div>
        <div id="challenges-list"></div>
      </div>
      <div id="arena-list"></div>
      <button type="button" id="arena-random" class="arena-btn arena-random">
        <div class="arena-btn-name">Aléatoire</div>
        <div class="arena-btn-desc">Une arène surprise à chaque partie</div>
      </button>
    </div>
    <div id="arena-intro" class="hidden">
      <div id="arena-intro-label">ARÈNE</div>
      <div id="arena-intro-name"></div>
      <div id="arena-intro-desc"></div>
    </div>
    <div id="controls" class="hidden">
      <button type="button" id="btn-left" class="control-btn" aria-label="Gauche"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
      <button type="button" id="btn-right" class="control-btn" aria-label="Droite"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const CELL_EMPTY = 0, CELL_WALL = 2, TRAIL_BASE = 10;
    const DIR_UP = 0, DIR_RIGHT = 1, DIR_DOWN = 2, DIR_LEFT = 3;
    const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
    const BASE_TICK = 130, MIN_TICK = 62, ARENA_BORDER = 2, ARENA_SCALE = 3;
    const CELL_SIZE = 1, WALL_H = 1.5, TRAIL_H = 1.1, PERIM_H = 1.8;
    const CAM_DIR_ANGLES = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
    const KILL_BONUS = 300, WIN_BONUS = 500;

    const CHALLENGES = [
      { id: 'eliminate_all', name: 'Chasseur', desc: 'Élimine les 2 adversaires',
        check: s => s.won && s.kills >= 2 },
      { id: 'survive_30', name: 'Endurant', desc: 'Survis 30 secondes',
        check: s => s.time >= 30 },
      { id: 'compresseur_30', name: 'Compressé', desc: '30 s dans Le Compresseur',
        check: s => s.arenaId === 'compresseur' && s.time >= 30 },
      { id: 'win_classique', name: 'Duel', desc: 'Gagne dans Le Classique',
        check: s => s.won && s.arenaId === 'classique' },
      { id: 'score_100', name: 'Centurion', desc: 'Atteins 100 points',
        check: s => s.score >= 100 },
    ];

    const BOT_DEFS = [
      { name: 'Spectre', isPlayer: false, body: 0xff66cc, glow: 0xff0088, wheel: 0xff88cc, trail: 0xffb8e8, trailGlow: 0xff44aa },
      { name: 'Phantom', isPlayer: false, body: 0x66ff88, glow: 0x00ff66, wheel: 0x88ffaa, trail: 0xb8ffd8, trailGlow: 0x44ff88 },
    ];

    const COLOR_PRESETS = [
      { id: 'cyan', body: 0xffe566, glow: 0xffcc00, wheel: 0x00eeff, trail: 0xb8f8ff, trailGlow: 0x00eeff },
      { id: 'magenta', body: 0xffaacc, glow: 0xff66bb, wheel: 0xff44aa, trail: 0xffb8e8, trailGlow: 0xff0088 },
      { id: 'orange', body: 0xffee88, glow: 0xffaa00, wheel: 0xff8800, trail: 0xffd8a8, trailGlow: 0xff6600 },
      { id: 'lime', body: 0xeeff88, glow: 0xaaff00, wheel: 0x66ff44, trail: 0xd8ffb8, trailGlow: 0x44ff00 },
      { id: 'violet', body: 0xddaaff, glow: 0xaa66ff, wheel: 0x8844ff, trail: 0xe8ccff, trailGlow: 0x6600ff },
      { id: 'crimson', body: 0xffaaaa, glow: 0xff4444, wheel: 0xff0022, trail: 0xffc8c8, trailGlow: 0xff0044 },
    ];

    const canvas = document.getElementById('game');
    const scoreEl = document.getElementById('score');
    const arenaNameEl = document.getElementById('arena-name');
    const timerEl = document.getElementById('timer');
    const highScoreEl = document.getElementById('high-score');
    const rivalsEl = document.getElementById('rivals');
    const challengeHudEl = document.getElementById('challenge-hud');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayScore = document.getElementById('overlay-score');
    const overlayBest = document.getElementById('overlay-best');
    const overlayRecord = document.getElementById('overlay-record');
    const overlayChallenge = document.getElementById('overlay-challenge');
    const overlayNext = document.getElementById('overlay-next');
    const overlayHint = document.getElementById('overlay-hint');
    const arenaMenu = document.getElementById('arena-menu');
    const arenaList = document.getElementById('arena-list');
    const arenaRandomBtn = document.getElementById('arena-random');
    const cosmeticPicker = document.getElementById('cosmetic-picker');
    const challengesList = document.getElementById('challenges-list');
    const arenaIntro = document.getElementById('arena-intro');
    const arenaIntroName = document.getElementById('arena-intro-name');
    const arenaIntroDesc = document.getElementById('arena-intro-desc');
    const controls = document.getElementById('controls');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    let gridW, gridH, grid, riders = [], mobileWalls = [], arenaState, currentArena;
    let score, highScore, tickMs, lastTick, playing, turnQueue, gameStartTime, kills, activeChallengeId;
    let audioCtx, engineOsc, engineGain;
    let scene, camera, renderer, composer, bloomPass, mobileMeshes = [], cellMeshes, trailMats;
    let smoothCamX = 0, smoothCamZ = 0, smoothCamAngle = -Math.PI / 2;
    let camReady = false;
    let introUntil = 0;
    let explosions = [];
    let matWall, matMobile, matPerimeter, boxGeo;
    const _worldPos = new THREE.Vector3();

    const ARENA_DESC = {
      battement: 'Des murs oscillent — évite les adversaires.',
      compresseur: 'L\'arène se resserre — survive aux autres cycles.',
      piege: 'Des portes piègent — et les Spectres aussi.',
      classique: 'Affrontement classique — dernier en vie gagne.',
    };

    const ARENAS = [
      { id: 'battement', name: 'Le Battement',
        init() {
          mobileWalls = [
            { x: Math.floor(gridW/2), y: Math.floor(gridH/2), dir: DIR_RIGHT, min: ARENA_BORDER+3, max: gridW-ARENA_BORDER-4, interval: 4000, lastMove: performance.now(), warning: false },
            { x: Math.floor(gridW/2), y: Math.floor(gridH/3), dir: DIR_LEFT, min: ARENA_BORDER+3, max: gridW-ARENA_BORDER-4, interval: 3000, lastMove: performance.now(), warning: false },
          ];
          arenaState = {};
        },
        update(now) {
          for (const w of mobileWalls) {
            const e = now - w.lastMove;
            w.warning = e > w.interval - 800;
            if (e >= w.interval) {
              w.lastMove = now; const step = w.dir === DIR_RIGHT ? 1 : -1;
              let nx = w.x + step;
              if (nx > w.max || nx < w.min) { w.dir = w.dir === DIR_RIGHT ? DIR_LEFT : DIR_RIGHT; nx = w.x + (w.dir === DIR_RIGHT ? 1 : -1); }
              w.x = nx; syncMobileMeshes(); playWallShift();
            }
          }
        },
      },
      { id: 'compresseur', name: 'Le Compresseur',
        init() { mobileWalls = []; arenaState = { margin: 0, lastShrink: performance.now(), interval: 5000, warning: false }; },
        update(now) {
          const s = arenaState, e = now - s.lastShrink;
          s.warning = e > s.interval - 1000;
          if (e >= s.interval) {
            s.lastShrink = now; s.margin++;
            const m = s.margin, lim = Math.floor(Math.min(gridW, gridH)/2) - ARENA_BORDER - 4;
            if (m > lim) return;
            for (let x = m; x < gridW-m; x++) { setCell(x, m, CELL_WALL); setCell(x, gridH-1-m, CELL_WALL); }
            for (let y = m; y < gridH-m; y++) { setCell(m, y, CELL_WALL); setCell(gridW-1-m, y, CELL_WALL); }
            playWallShift();
          }
        },
      },
      { id: 'piege', name: 'Le Piège',
        init() {
          mobileWalls = []; const cx = Math.floor(gridW/2);
          arenaState = { gates: [
            { x: cx-4, yMin: ARENA_BORDER+2, yMax: gridH-ARENA_BORDER-3, open: true, interval: 4500, lastToggle: performance.now(), warning: false },
            { x: cx+4, yMin: ARENA_BORDER+2, yMax: gridH-ARENA_BORDER-3, open: true, interval: 3500, lastToggle: performance.now(), warning: false },
          ]};
          syncGates();
        },
        update(now) {
          for (const g of arenaState.gates) {
            const e = now - g.lastToggle;
            g.warning = e > g.interval - 900;
            if (e >= g.interval) { g.lastToggle = now; g.open = !g.open; syncGate(g); playWallShift(); }
          }
        },
      },
      { id: 'classique', name: 'Le Classique', init() { mobileWalls = []; arenaState = {}; }, update() {} },
    ];

    function syncGate(g) {
      for (let y = g.yMin; y <= g.yMax; y++) {
        if (g.open) { if (getCell(g.x,y) === CELL_WALL) setCell(g.x, y, CELL_EMPTY); }
        else setCell(g.x, y, CELL_WALL);
      }
    }
    function syncGates() { for (const g of arenaState.gates) syncGate(g); }
    function loadHighScore() { try { return parseInt(localStorage.getItem('lc_highscore')||'0',10); } catch { return 0; } }
    function saveHighScore(v) { try { localStorage.setItem('lc_highscore', String(v)); } catch {} }
    function loadArenaBest(id) { try { return parseInt(localStorage.getItem('lc_best_'+id)||'0',10); } catch { return 0; } }
    function saveArenaBest(id, v) { try { localStorage.setItem('lc_best_'+id, String(v)); } catch {} }

    function loadChallenges() { try { return JSON.parse(localStorage.getItem('lc_challenges')||'{}'); } catch { return {}; } }
    function saveChallengeDone(id) {
      const c = loadChallenges(); c[id] = true;
      try { localStorage.setItem('lc_challenges', JSON.stringify(c)); } catch {}
    }

    function buildChallengesList() {
      const done = loadChallenges();
      challengesList.innerHTML = '';
      CHALLENGES.forEach(ch => {
        const el = document.createElement('div');
        const isDone = !!done[ch.id];
        el.className = 'challenge-item'+(isDone ? ' done' : '')+(!isDone && activeChallengeId === ch.id ? ' active' : '');
        el.innerHTML =
          '<span class="challenge-check">'+(isDone ? '✓' : '○')+'</span>'+
          '<div><div class="challenge-name">'+ch.name+'</div>'+ch.desc+'</div>';
        if (!isDone) {
          el.addEventListener('click', () => {
            activeChallengeId = activeChallengeId === ch.id ? null : ch.id;
            buildChallengesList();
          });
        }
        challengesList.appendChild(el);
      });
    }

    function checkChallenges(stats) {
      const done = loadChallenges();
      const unlocked = [];
      for (const ch of CHALLENGES) {
        if (!done[ch.id] && ch.check(stats)) {
          saveChallengeDone(ch.id);
          unlocked.push(ch);
        }
      }
      return unlocked;
    }

    function getActiveChallenge() {
      if (!activeChallengeId) return null;
      return CHALLENGES.find(c => c.id === activeChallengeId) || null;
    }

    function playVictory() {
      haptic([20, 30, 20, 30, 40]);
      [440, 554, 659, 880].forEach((f, i) => setTimeout(() => playTone(f, .12, 'sine', .07), i * 80));
    }

    function getArenaById(id) { return ARENAS.find(a => a.id === id); }
    function loadArenaPref() { try { return localStorage.getItem('lc_arena_pref') || 'random'; } catch { return 'random'; } }
    function saveArenaPref(id) { try { localStorage.setItem('lc_arena_pref', id); } catch {} }

    function loadCosmetic() { try { return localStorage.getItem('lc_cosmetic') || 'cyan'; } catch { return 'cyan'; } }
    function saveCosmetic(id) { try { localStorage.setItem('lc_cosmetic', id); } catch {} }
    function getCosmeticPreset() { return COLOR_PRESETS.find(p => p.id === loadCosmetic()) || COLOR_PRESETS[0]; }
    function getRiderDefs() {
      const c = getCosmeticPreset();
      return [{ name: 'Toi', isPlayer: true, body: c.body, glow: c.glow, wheel: c.wheel, trail: c.trail, trailGlow: c.trailGlow }, ...BOT_DEFS];
    }
    function hexCss(h) { return '#'+h.toString(16).padStart(6,'0'); }
    function applyScoreColor() {
      const c = getCosmeticPreset();
      scoreEl.style.color = hexCss(c.trailGlow);
      scoreEl.style.textShadow = '0 0 10px '+hexCss(c.trailGlow)+', 0 0 20px '+hexCss(c.trailGlow);
    }

    function buildCosmeticPicker() {
      const current = loadCosmetic();
      cosmeticPicker.innerHTML = '';
      COLOR_PRESETS.forEach(p => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'color-swatch'+(p.id === current ? ' selected' : '');
        btn.style.background = 'linear-gradient(135deg, '+hexCss(p.body)+', '+hexCss(p.trailGlow)+')';
        btn.style.setProperty('--swatch-glow', hexCss(p.trailGlow));
        btn.setAttribute('aria-label', p.id);
        btn.addEventListener('click', () => {
          saveCosmetic(p.id);
          buildCosmeticPicker();
          applyScoreColor();
        });
        cosmeticPicker.appendChild(btn);
      });
    }

    function buildArenaMenu() {
      buildCosmeticPicker();
      buildChallengesList();
      arenaList.innerHTML = '';
      ARENAS.forEach(a => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'arena-btn';
        btn.innerHTML =
          '<div class="arena-btn-name">'+a.name+'</div>'+
          '<div class="arena-btn-desc">'+(ARENA_DESC[a.id]||'')+'</div>'+
          '<div class="arena-btn-best">Record : '+loadArenaBest(a.id).toLocaleString('fr-FR')+'</div>';
        btn.addEventListener('click', () => startWithArena(a.id));
        arenaList.appendChild(btn);
      });
    }

    function showArenaMenu() {
      buildArenaMenu();
      playing = false;
      stopEngine();
      challengeHudEl.textContent = '';
      arenaMenu.classList.remove('hidden');
      overlay.classList.add('hidden');
      controls.classList.add('hidden');
    }

    function startWithArena(id) {
      unlockAudio();
      if (id === 'random') {
        currentArena = ARENAS[Math.floor(Math.random() * ARENAS.length)];
        saveArenaPref('random');
      } else {
        currentArena = getArenaById(id);
        saveArenaPref(id);
      }
      arenaMenu.classList.add('hidden');
      resetGame();
    }

    function trailVal(id) { return TRAIL_BASE + id; }
    function isTrail(v) { return v >= TRAIL_BASE; }
    function isBlocked(v) { return v !== CELL_EMPTY; }
    function getPlayer() { return riders.find(r => r.isPlayer); }
    function aliveBots() { return riders.filter(r => !r.isPlayer && r.alive); }

    function haptic(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {}
    }

    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        engineOsc = audioCtx.createOscillator(); engineGain = audioCtx.createGain();
        engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 90; engineGain.gain.value = 0;
        engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination); engineOsc.start();
      } catch {}
    }
    function unlockAudio() { if (!audioCtx) initAudio(); if (audioCtx?.state==='suspended') audioCtx.resume(); if (engineGain&&playing) engineGain.gain.value=0.028; }
    function updateEngineSound() {
      if (!engineOsc||!playing) return;
      const sp = (BASE_TICK-tickMs)/(BASE_TICK-MIN_TICK);
      engineOsc.frequency.setTargetAtTime(70+sp*140, audioCtx.currentTime, 0.05);
      engineGain.gain.setTargetAtTime(0.02+sp*0.03, audioCtx.currentTime, 0.05);
    }
    function stopEngine() { if (engineGain) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); }
    function playTone(f,d,t,v) {
      if (!audioCtx) return;
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=t||'square'; o.frequency.value=f; g.gain.value=v||0.08;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);
    }
    const playTurn = () => { playTone(320,.06,'square',.05); haptic(10); };
    const playWallShift = () => { playTone(180,.12,'sawtooth',.06); haptic(18); };
    const playNearMiss = () => { playTone(520,.08,'sine',.07); haptic(25); };
    function playCrash() {
      haptic([60, 40, 100, 40, 140]);
      for (let i=0;i<5;i++) setTimeout(()=>playTone(80+Math.random()*200,.15,'sawtooth',.12), i*40);
    }

    function initGridDimensions() {
      gridW = 18 * ARENA_SCALE;
      gridH = 28 * ARENA_SCALE;
    }

    function gridToWorld(gx, gy, out) {
      const v = out || _worldPos;
      v.set(
        (gx - gridW/2 + 0.5) * CELL_SIZE,
        0,
        (gy - gridH/2 + 0.5) * CELL_SIZE
      );
      return v;
    }

    function makeMat(color, emissive, opacity, tall) {
      return new THREE.MeshStandardMaterial({
        color, emissive, emissiveIntensity: tall ? 1.5 : 1.05,
        transparent: true, opacity, metalness: 0.1, roughness: 0.4,
      });
    }

    function initBloom() {
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.55, 0.38, 0.1
      );
      composer.addPass(bloomPass);
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020208);
      scene.fog = new THREE.Fog(0x020208, 40, 90);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;

      scene.add(new THREE.AmbientLight(0x334466, 0.45));
      const dl = new THREE.DirectionalLight(0xffffff, 0.35);
      dl.position.set(10, 20, 5); scene.add(dl);

      matWall = makeMat(0xb794f6, 0x7c3aed, 0.82, false);
      matMobile = makeMat(0xffaa44, 0xff6600, 0.85, false);
      matPerimeter = makeMat(0xc4b5fd, 0x9333ea, 0.92, true);
      boxGeo = new THREE.BoxGeometry(CELL_SIZE*0.92, 1, CELL_SIZE*0.92);
      trailMats = [];

      const floor = new THREE.GridHelper(Math.max(gridW, gridH), Math.max(gridW, gridH), 0x00ff66, 0x003318);
      floor.position.y = 0.01; scene.add(floor);

      cellMeshes = new Map();
      mobileMeshes = [];
      initBloom();
    }

    function buildBike(def) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.22, 0.85),
        makeMat(def.body, def.glow, 1, true)
      );
      body.position.y = 0.25; g.add(body);
      const cockpit = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 0.12, 0.35),
        makeMat(0xffffee, 0xffffaa, 1, true)
      );
      cockpit.position.set(0, 0.38, -0.15); g.add(cockpit);
      const wheelGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 12);
      const wMat = makeMat(0xffffff, def.wheel, 1, true);
      [-0.28, 0.28].forEach(s => {
        const w = new THREE.Mesh(wheelGeo, wMat);
        w.rotation.z = Math.PI/2; w.position.set(s, 0.12, 0.28); g.add(w);
      });
      const emitter = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        makeMat(def.wheel, def.wheel, 1, true)
      );
      emitter.position.set(0, 0.3, 0.45); g.add(emitter);
      return g;
    }

    function cellKey(x,y) { return x+','+y; }

    function addCellMesh(x, y, type) {
      const key = cellKey(x,y);
      removeCellMesh(x, y);
      const perimeter = type === CELL_WALL && isPerimeterCell(x,y);
      let mat, h;
      if (isTrail(type)) { mat = trailMats[type - TRAIL_BASE]; h = TRAIL_H; }
      else if (perimeter) { mat = matPerimeter; h = PERIM_H; }
      else { mat = type === CELL_WALL ? matWall : matMobile; h = WALL_H; }
      const mesh = new THREE.Mesh(boxGeo, mat);
      const p = gridToWorld(x, y);
      mesh.position.set(p.x, h/2, p.z);
      mesh.scale.y = h;
      scene.add(mesh);
      cellMeshes.set(key, mesh);
    }

    function removeCellMesh(x, y) {
      const key = cellKey(x,y);
      const m = cellMeshes.get(key);
      if (m) { scene.remove(m); cellMeshes.delete(key); }
    }

    function syncMobileMeshes() {
      mobileMeshes.forEach(m => scene.remove(m));
      mobileMeshes = [];
      for (const w of mobileWalls) {
        const mesh = new THREE.Mesh(boxGeo, matMobile.clone());
        const p = gridToWorld(w.x, w.y);
        mesh.position.set(p.x, WALL_H/2, p.z);
        mesh.scale.y = WALL_H;
        scene.add(mesh);
        mobileMeshes.push(mesh);
      }
    }

    function clearCellMeshes() {
      cellMeshes.forEach(m => scene.remove(m));
      cellMeshes.clear();
      mobileMeshes.forEach(m => scene.remove(m));
      mobileMeshes = [];
      (riders || []).forEach(r => {
        if (r.liveTrailMesh) { scene.remove(r.liveTrailMesh); r.liveTrailMesh = null; }
      });
    }

    function createGrid() {
      grid = new Uint8Array(gridW * gridH);
      clearCellMeshes();
      const b = ARENA_BORDER;
      for (let layer = 0; layer < b; layer++) {
        for (let x = 0; x < gridW; x++) { setCell(x, layer, CELL_WALL); setCell(x, gridH-1-layer, CELL_WALL); }
        for (let y = 0; y < gridH; y++) { setCell(layer, y, CELL_WALL); setCell(gridW-1-layer, y, CELL_WALL); }
      }
    }

    function isPerimeterCell(x,y) {
      const b = ARENA_BORDER;
      return x<b||x>=gridW-b||y<b||y>=gridH-b;
    }
    function getCell(x,y) { if (x<0||x>=gridW||y<0||y>=gridH) return CELL_WALL; return grid[y*gridW+x]; }

    function setCell(x, y, val) {
      if (x<0||x>=gridW||y<0||y>=gridH) return;
      const old = grid[y*gridW+x];
      if (old === val) return;
      grid[y*gridW+x] = val;
      if (val === CELL_EMPTY) removeCellMesh(x,y);
      else addCellMesh(x,y,val);
    }

    function createRiders() {
      (riders || []).forEach(r => { if (r.mesh) scene.remove(r.mesh); });
      riders = [];
      trailMats = getRiderDefs().map(d => makeMat(d.trail, d.trailGlow, 0.55, false));

      const spawns = [
        { x: Math.floor(gridW/2), y: gridH - ARENA_BORDER - 6, dir: DIR_UP },
        { x: Math.floor(gridW/4), y: ARENA_BORDER + 6, dir: DIR_DOWN },
        { x: Math.floor(3*gridW/4), y: ARENA_BORDER + 6, dir: DIR_DOWN },
      ];

      getRiderDefs().forEach((def, i) => {
        const s = spawns[i];
        const rider = {
          id: i, name: def.name, isPlayer: def.isPlayer, def, alive: true,
          x: s.x, y: s.y, dir: s.dir,
          prevX: s.x, prevY: s.y, renderX: s.x, renderY: s.y,
          smoothAngle: CAM_DIR_ANGLES[s.dir],
          mesh: null, liveTrailMesh: null, liveTrailMat: makeMat(def.trail, def.trailGlow, 0.35, false),
        };
        rider.mesh = buildBike(def);
        scene.add(rider.mesh);
        riders.push(rider);
      });
    }

    function spaceInDir(rider, dir, maxLook) {
      let x = rider.x, y = rider.y, n = 0;
      for (let i = 0; i < maxLook; i++) {
        x += DX[dir]; y += DY[dir];
        if (isBlocked(getCell(x, y)) || isMobileWallAt(x, y)) return n;
        n++;
      }
      return n;
    }

    function canRiderGo(rider, dir, moves) {
      const nx = rider.x + DX[dir], ny = rider.y + DY[dir];
      return !isMoveBlocked(nx, ny, rider, moves);
    }

    function isMoveBlocked(x, y, rider, moves) {
      if (isBlocked(getCell(x, y)) || isMobileWallAt(x, y)) return true;
      for (const r of riders) {
        if (!r.alive || r === rider) continue;
        if (r.x !== x || r.y !== y) continue;
        const mv = moves && moves.find(m => m.rider === r);
        if (mv && (mv.nx !== r.x || mv.ny !== r.y)) continue;
        return true;
      }
      return false;
    }

    function chooseAiTurn(rider, moves) {
      const fwd = rider.dir, left = (rider.dir + 3) % 4, right = (rider.dir + 1) % 4;
      if (!canRiderGo(rider, fwd, moves)) {
        const lOk = canRiderGo(rider, left, moves), rOk = canRiderGo(rider, right, moves);
        if (lOk && rOk) return spaceInDir(rider, left) >= spaceInDir(rider, right) ? left : right;
        if (lOk) return left;
        if (rOk) return right;
        return fwd;
      }
      for (let look = 1; look <= 3; look++) {
        const tx = rider.x + DX[fwd] * look, ty = rider.y + DY[fwd] * look;
        if (isBlocked(getCell(tx, ty)) || isMobileWallAt(tx, ty)) {
          const lOk = canRiderGo(rider, left, moves), rOk = canRiderGo(rider, right, moves);
          if (lOk && rOk) {
            if (Math.random() < 0.12) return Math.random() < 0.5 ? left : right;
            return spaceInDir(rider, left) >= spaceInDir(rider, right) ? left : right;
          }
          if (lOk) return left;
          if (rOk) return right;
          break;
        }
      }
      if (Math.random() < 0.018 && canRiderGo(rider, left, moves)) return left;
      if (Math.random() < 0.018 && canRiderGo(rider, right, moves)) return right;
      return fwd;
    }

    function updateHud() {
      const player = getPlayer();
      arenaNameEl.textContent = currentArena.name;
      highScoreEl.textContent = 'BEST '+highScore.toLocaleString('fr-FR');
      scoreEl.textContent = score.toLocaleString('fr-FR');
      const bots = aliveBots().length;
      rivalsEl.textContent = bots > 0 ? bots+' adversaire'+(bots>1?'s':'') : 'DERNIER EN VIE !';
      if (playing) timerEl.textContent = 'T : '+((performance.now()-gameStartTime)/1000).toFixed(2);
    }

    function showArenaIntro() {
      arenaIntroName.textContent = currentArena.name;
      arenaIntroDesc.textContent = ARENA_DESC[currentArena.id] || '';
      arenaIntro.classList.remove('hidden');
      introUntil = performance.now() + 1300;
      setTimeout(() => arenaIntro.classList.add('hidden'), 1100);
    }

    function resetGame() {
      initGridDimensions();
      if (!scene) initThree();
      createGrid();
      currentArena.init();
      syncMobileMeshes();
      createRiders();
      score = 0; kills = 0; tickMs = BASE_TICK; lastTick = 0; turnQueue = null;
      playing = true; gameStartTime = performance.now();
      challengeHudEl.textContent = getActiveChallenge() ? 'Défi : '+getActiveChallenge().name : '';
      camReady = false;
      const player = getPlayer();
      if (player) player.smoothAngle = CAM_DIR_ANGLES[player.dir];
      riders.forEach(r => { if (r.mesh) r.mesh.visible = true; });
      clearExplosions();
      overlay.classList.add('hidden'); controls.classList.remove('hidden');
      showArenaIntro();
      updateHud(); unlockAudio(); updateEngineSound();
      updateRiderMeshes();
    }

    function turnLeft() {
      const player = getPlayer();
      if (!playing || !player?.alive) return; unlockAudio();
      const nd = (player.dir+3)%4;
      if (nd !== (player.dir+2)%4) { turnQueue = nd; playTurn(); }
    }
    function turnRight() {
      const player = getPlayer();
      if (!playing || !player?.alive) return; unlockAudio();
      const nd = (player.dir+1)%4;
      if (nd !== (player.dir+2)%4) { turnQueue = nd; playTurn(); }
    }

    function isMobileWallAt(x,y) { return mobileWalls.some(w => w.x===x && w.y===y); }

    function checkNearMiss() {
      const player = getPlayer();
      if (!player?.alive) return;
      for (let d=0; d<4; d++) {
        const c = getCell(player.x+DX[d], player.y+DY[d]);
        if (isBlocked(c)||isMobileWallAt(player.x+DX[d], player.y+DY[d])) { playNearMiss(); return; }
      }
    }

    function gameTick() {
      if (!playing) return;
      const moves = [];
      for (const r of riders) {
        if (!r.alive) continue;
        let newDir = r.dir;
        if (r.isPlayer && turnQueue !== null) {
          newDir = turnQueue;
          turnQueue = null;
        } else if (!r.isPlayer) {
          newDir = chooseAiTurn(r, moves);
        }
        moves.push({
          rider: r, newDir,
          nx: r.x + DX[newDir], ny: r.y + DY[newDir],
        });
      }

      const targets = new Map();
      for (const m of moves) {
        const key = m.nx+','+m.ny;
        if (!targets.has(key)) targets.set(key, []);
        targets.get(key).push(m.rider);
      }

      const dead = new Set();
      for (const m of moves) {
        if (isMoveBlocked(m.nx, m.ny, m.rider, moves)) dead.add(m.rider);
        else if ((targets.get(m.nx+','+m.ny)||[]).length > 1) dead.add(m.rider);
      }

      let playerDied = false;
      for (const m of moves) {
        if (dead.has(m.rider)) {
          if (m.rider.isPlayer) playerDied = true;
          else if (getPlayer()?.alive) { kills++; score += KILL_BONUS; playTone(640,.1,'sine',.06); }
          killRider(m.rider);
          continue;
        }
        m.rider.prevX = m.rider.x; m.rider.prevY = m.rider.y;
        m.rider.dir = m.newDir;
        setCell(m.rider.x, m.rider.y, trailVal(m.rider.id));
        m.rider.x = m.nx; m.rider.y = m.ny;
        if (m.rider.isPlayer) {
          score++;
          if (score%12===0 && tickMs>MIN_TICK) { tickMs -= 2; updateEngineSound(); }
        }
      }

      if (playerDied) endGame(false);
      else if (getPlayer()?.alive && aliveBots().length === 0) endGame(true);
      else { checkNearMiss(); updateHud(); }
    }

    function clearExplosions() {
      explosions.forEach(e => scene.remove(e.points));
      explosions = [];
    }

    function spawnExplosion(rider) {
      if (!rider || !scene) return;
      const p = gridToWorld(rider.x, rider.y, _worldPos);
      const count = 40;
      const positions = new Float32Array(count * 3);
      const vel = [];
      for (let i = 0; i < count; i++) {
        positions[i * 3] = p.x;
        positions[i * 3 + 1] = TRAIL_H + 0.2;
        positions[i * 3 + 2] = p.z;
        vel.push({
          x: (Math.random() - 0.5) * 0.35,
          y: 0.05 + Math.random() * 0.2,
          z: (Math.random() - 0.5) * 0.35,
        });
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const points = new THREE.Points(geo, new THREE.PointsMaterial({
        color: rider.def.body, size: 0.3, transparent: true, opacity: 1,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      scene.add(points);
      explosions.push({ points, vel, life: 1 });
      if (rider.mesh) rider.mesh.visible = false;
    }

    function updateExplosions() {
      explosions = explosions.filter(e => {
        e.life -= 0.028;
        const pos = e.points.geometry.attributes.position;
        for (let i = 0; i < e.vel.length; i++) {
          pos.array[i * 3] += e.vel[i].x;
          pos.array[i * 3 + 1] += e.vel[i].y;
          pos.array[i * 3 + 2] += e.vel[i].z;
          e.vel[i].y -= 0.01;
        }
        pos.needsUpdate = true;
        e.points.material.opacity = Math.max(0, e.life);
        if (e.life <= 0) { scene.remove(e.points); return false; }
        return true;
      });
    }

    function killRider(rider) {
      if (!rider.alive) return;
      rider.alive = false;
      if (rider.isPlayer) playCrash();
      else playTone(120,.08,'sawtooth',.05);
      spawnExplosion(rider);
    }

    function endGame(won) {
      playing = false; stopEngine();
      const time = (performance.now() - gameStartTime) / 1000;
      if (won) { score += WIN_BONUS; playVictory(); }
      const rank = won ? 1 : 1 + aliveBots().length;
      const rec = score > highScore;
      if (rec) { highScore = score; saveHighScore(highScore); }
      const arenaRec = score > loadArenaBest(currentArena.id);
      if (arenaRec) saveArenaBest(currentArena.id, score);
      const unlocked = checkChallenges({ won, kills, score, time, arenaId: currentArena.id });
      buildChallengesList();
      overlayTitle.textContent = won ? 'VICTOIRE !' : currentArena.name;
      overlayScore.textContent = score.toLocaleString('fr-FR');
      const rankTxt = won ? '1er — dernier en vie !' : rank+'e place';
      const killTxt = kills > 0 ? ' · '+kills+' kill'+(kills>1?'s':'') : '';
      const winTxt = won ? ' · +'+WIN_BONUS+' bonus' : '';
      overlayBest.textContent = arenaRec
        ? 'Record arène : '+score.toLocaleString('fr-FR')+' · '+rankTxt+killTxt+winTxt
        : 'Record : '+highScore.toLocaleString('fr-FR')+' · '+rankTxt+killTxt+winTxt;
      overlayRecord.classList.toggle('hidden', !rec);
      if (unlocked.length) {
        overlayChallenge.textContent = 'Défi débloqué : '+unlocked.map(c => c.name).join(', ');
        overlayChallenge.classList.remove('hidden');
      } else {
        overlayChallenge.classList.add('hidden');
      }
      overlayNext.textContent = 'Arène : '+currentArena.name;
      overlay.classList.remove('hidden'); controls.classList.add('hidden');
      challengeHudEl.textContent = '';
    }

    function updateMobileWarnings(now) {
      if (!mobileMeshes?.length) return;
      mobileMeshes.forEach((mesh, i) => {
        const w = mobileWalls[i];
        if (!w || !mesh.material.emissiveIntensity) return;
        mesh.material.emissiveIntensity = w.warning
          ? 0.8 + Math.sin(now / 70) * 0.6
          : 1.2;
      });
    }

    function updateRenderPositions(ts) {
      for (const r of riders) {
        if (!r.alive) continue;
        if (!playing || !lastTick) { r.renderX = r.x; r.renderY = r.y; continue; }
        let t = Math.min(1, (ts-lastTick)/tickMs);
        t = t*t*(3-2*t);
        r.renderX = r.prevX + (r.x-r.prevX)*t;
        r.renderY = r.prevY + (r.y-r.prevY)*t;
      }
    }

    function updateLiveTrail(r) {
      if (!r.alive || !playing) {
        if (r.liveTrailMesh) { scene.remove(r.liveTrailMesh); r.liveTrailMesh = null; }
        return;
      }
      if (!r.liveTrailMesh) {
        r.liveTrailMesh = new THREE.Mesh(boxGeo, r.liveTrailMat);
        scene.add(r.liveTrailMesh);
      }
      const p = gridToWorld(r.renderX, r.renderY);
      r.liveTrailMesh.position.set(p.x, TRAIL_H/2, p.z);
      r.liveTrailMesh.scale.y = TRAIL_H;
    }

    function updateRiderMeshes() {
      for (const r of riders) {
        if (!r.mesh || !r.alive) continue;
        const p = gridToWorld(r.renderX, r.renderY, _worldPos);
        r.mesh.position.set(p.x, 0, p.z);
        const targetAngle = CAM_DIR_ANGLES[r.dir];
        let angleDiff = targetAngle - r.smoothAngle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        r.smoothAngle += angleDiff * 0.28;
        r.mesh.rotation.y = r.smoothAngle;
        updateLiveTrail(r);
      }
    }

    function updateCamera() {
      const player = getPlayer();
      if (!player) return;

      const p = gridToWorld(player.renderX, player.renderY, _worldPos);
      const targetAngle = CAM_DIR_ANGLES[player.dir];
      const dist = 14;
      const height = 12;
      const lookAhead = 4;

      if (!camReady) {
        smoothCamX = p.x;
        smoothCamZ = p.z;
        smoothCamAngle = targetAngle;
        camReady = true;
      }

      smoothCamX += (p.x - smoothCamX) * 0.18;
      smoothCamZ += (p.z - smoothCamZ) * 0.18;

      let angleDiff = targetAngle - smoothCamAngle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      smoothCamAngle += angleDiff * 0.1;

      const offX = -Math.cos(smoothCamAngle) * dist;
      const offZ = -Math.sin(smoothCamAngle) * dist;
      const lookX = smoothCamX + Math.cos(smoothCamAngle) * lookAhead;
      const lookZ = smoothCamZ + Math.sin(smoothCamAngle) * lookAhead;

      camera.position.set(smoothCamX + offX, height, smoothCamZ + offZ);
      camera.lookAt(lookX, TRAIL_H, lookZ);
    }

    function resize() {
      if (!renderer) return;
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      if (composer) composer.setSize(w, h);
    }

    function gameLoop(ts) {
      if (scene) {
        updateRenderPositions(ts);
        updateRiderMeshes();
        updateCamera();
      }
      if (playing && ts >= introUntil && ts - lastTick >= tickMs) {
        currentArena.update(ts);
        gameTick();
        lastTick = ts;
      }
      updateMobileWarnings(ts);
      updateExplosions();
      if (composer) composer.render();
      else if (renderer) renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }

    function bindControlButton(btn, action) {
      const press = e => { e.preventDefault(); if (!playing) return; btn.classList.add('pressed'); action(); };
      const release = () => btn.classList.remove('pressed');
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointerleave', release);
      btn.addEventListener('pointercancel', release);
    }
    bindControlButton(btnLeft, turnLeft);
    bindControlButton(btnRight, turnRight);

    overlay.addEventListener('pointerdown', e => { e.preventDefault(); showArenaMenu(); });
    arenaRandomBtn.addEventListener('click', () => startWithArena('random'));
    window.addEventListener('keydown', e => {
      if (e.key==='ArrowLeft'||e.key==='a'||e.key==='A') { if (playing) turnLeft(); }
      else if (e.key==='ArrowRight'||e.key==='d'||e.key==='D') { if (playing) turnRight(); }
      else if ((e.key===' '||e.key==='Enter') && !playing && !arenaMenu.classList.contains('hidden')) { /* menu */ }
      else if ((e.key===' '||e.key==='Enter') && !playing) { showArenaMenu(); }
    });
    window.addEventListener('resize', resize);

    highScore = loadHighScore();
    initGridDimensions();
    applyScoreColor();
    buildArenaMenu();
    showArenaMenu();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
