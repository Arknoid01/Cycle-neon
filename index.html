<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#00eeff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <title>Light Cycle Neon</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud-top"><div id="arena-name"></div><div id="timer">T : 0.00</div></div>
    <div id="score">0</div>
    <div id="high-score"></div>
    <div id="rivals"></div>
    <div id="challenge-hud"></div>
    <div id="overlay" class="hidden">
      <div id="overlay-title"></div>
      <div id="overlay-score"></div>
      <div id="overlay-best"></div>
      <div id="overlay-record" class="hidden">NOUVEAU RECORD !</div>
      <div id="overlay-challenge" class="hidden"></div>
      <div id="overlay-next"></div>
      <div id="overlay-hint">Toucher pour choisir une arène</div>
    </div>
    <div id="arena-menu">
      <div id="arena-menu-title">LIGHT CYCLE</div>
      <div id="arena-menu-sub">CHOISIR UNE ARÈNE</div>
      <div id="cosmetic-section">
        <div id="cosmetic-label">TON CYCLE</div>
        <div id="cosmetic-picker"></div>
      </div>
      <div id="challenges-section">
        <div id="challenges-label">DÉFIS</div>
        <div id="challenges-list"></div>
      </div>
      <div id="arena-list"></div>
      <button type="button" id="arena-random" class="arena-btn arena-random">
        <div class="arena-btn-name">Aléatoire</div>
        <div class="arena-btn-desc">Une arène surprise à chaque partie</div>
      </button>
    </div>
    <div id="arena-intro" class="hidden">
      <div id="arena-intro-label">ARÈNE</div>
      <div id="arena-intro-name"></div>
      <div id="arena-intro-desc"></div>
    </div>
    <div id="controls" class="hidden">
      <button type="button" id="btn-left" class="control-btn" aria-label="Gauche"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
      <button type="button" id="btn-right" class="control-btn" aria-label="Droite"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
