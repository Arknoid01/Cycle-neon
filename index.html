<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#00eeff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <title>Light Cycle Neon</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="game-hud">
    <div id="hud-top"><div id="arena-name"></div><div id="timer">T : 0.00</div></div>
    <div id="score">0</div>
    <div id="high-score"></div>
    <div id="rivals"></div>
    <div id="challenge-hud"></div>
    <div id="multiplier-hud" class="hidden">×1</div>
    <div id="champ-hud" class="hidden"></div>
    <div id="overlay" class="hidden">
      <div id="overlay-title"></div>
      <div id="overlay-score"></div>
      <div id="overlay-best"></div>
      <div id="overlay-record" class="hidden">NOUVEAU RECORD !</div>
      <div id="overlay-challenge" class="hidden"></div>
      <div id="overlay-next"></div>
      <div id="overlay-hint">Toucher pour revenir au menu</div>
    </div>

    <div id="arena-intro" class="hidden">
      <div id="arena-intro-label">ARÈNE</div>
      <div id="arena-intro-name"></div>
      <div id="arena-intro-desc"></div>
    </div>
    <div id="controls" class="hidden">
      <button type="button" id="btn-left" class="control-btn" aria-label="Gauche"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
      <button type="button" id="btn-right" class="control-btn" aria-label="Droite"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
    </div>
    </div>

    <div id="home-menu">
      <div id="home-screen" class="menu-screen">
        <header class="home-header">
          <div class="home-title">LIGHT CYCLE</div>
          <div class="home-sub">NEON GRID</div>
          <div id="home-best" class="home-best"></div>
        </header>
        <div class="tile-grid">
          <button type="button" class="menu-tile tile-play" data-screen="play">
            <span class="tile-icon">▶</span>
            <span class="tile-label">Nouvelle partie</span>
            <span class="tile-desc">Choisir un scénario</span>
          </button>
          <button type="button" class="menu-tile tile-custom" data-screen="custom">
            <span class="tile-icon">◈</span>
            <span class="tile-label">Personnalisation</span>
            <span class="tile-desc">Couleur du cycle</span>
          </button>
          <button type="button" class="menu-tile tile-trophies" data-screen="trophies">
            <span class="tile-icon">★</span>
            <span class="tile-label">Trophées</span>
            <span class="tile-desc" id="trophy-summary">Défis et records</span>
          </button>
          <button type="button" class="menu-tile tile-options" data-screen="options">
            <span class="tile-icon">⚙</span>
            <span class="tile-label">Options</span>
            <span class="tile-desc">Son et confort</span>
          </button>
        </div>
      </div>

      <div id="play-screen" class="menu-screen hidden">
        <button type="button" class="menu-back" data-back>← Accueil</button>
        <h2 class="screen-title">Nouvelle partie</h2>
        <button type="button" id="start-championship" class="arena-btn arena-championship">
          <div class="arena-btn-name">🏆 Championnat</div>
          <div class="arena-btn-desc">5 manches · 6 concurrents · points cumulés</div>
        </button>
        <p class="screen-sub section-label">Arène rapide</p>
        <div id="arena-list"></div>
        <button type="button" id="arena-random" class="arena-btn arena-random">
          <div class="arena-btn-name">Aléatoire</div>
          <div class="arena-btn-desc">Une arène surprise à chaque partie</div>
        </button>
      </div>

      <div id="custom-screen" class="menu-screen hidden">
        <button type="button" class="menu-back" data-back>← Accueil</button>
        <h2 class="screen-title">Personnalisation</h2>
        <p class="screen-sub">Couleur et silhouette de ton light cycle</p>
        <div class="bike-preview-wrap">
          <canvas id="bike-preview-canvas" class="bike-preview-canvas"></canvas>
        </div>
        <p class="picker-label">Couleur</p>
        <div id="cosmetic-picker"></div>
        <p class="picker-label">Silhouette</p>
        <div id="chassis-picker" class="chassis-picker"></div>
      </div>

      <div id="trophies-screen" class="menu-screen hidden">
        <button type="button" class="menu-back" data-back>← Accueil</button>
        <h2 class="screen-title">Trophées</h2>
        <p class="screen-sub" id="trophies-progress"></p>
        <div id="challenges-list"></div>
      </div>

      <div id="options-screen" class="menu-screen hidden">
        <button type="button" class="menu-back" data-back>← Accueil</button>
        <h2 class="screen-title">Options</h2>
        <div class="options-list">
          <label class="option-row">
            <span class="option-label">Volume</span>
            <input type="range" id="opt-volume" min="0" max="100" value="100">
          </label>
          <label class="option-row option-toggle">
            <span class="option-label">Vibrations</span>
            <input type="checkbox" id="opt-haptic" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
          <label class="option-row option-toggle">
            <span class="option-label">Bloom néon</span>
            <input type="checkbox" id="opt-bloom" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </div>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
